# 仅 MySQL 配置（可选的轻量级方案）
# 如果只需要 MySQL，可以使用这个简化版本

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qwen-chat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: qwen_chat
      MYSQL_USER: ${MYSQL_USER:-qwen}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD:-qwen123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - qwen-chat-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  qwen-chat-network:
    driver: bridge

volumes:
  mysql_data:
