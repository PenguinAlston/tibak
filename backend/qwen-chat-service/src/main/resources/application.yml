server:
  port: 8080

spring:
  application:
    name: qwen-chat-service

  datasource:
    url: jdbc:postgresql://localhost:5432/qwen_chat
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # MongoDB 配置（可选，不使用可注释）
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/qwen_chat}

  # Redis 配置（可选）
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

# 条件化配置
qwen:
  chat:
    # 是否使用 MongoDB 存储聊天记录（false 则使用 PostgreSQL）
    use-mongodb: ${USE_MONGODB:false}

ai:
  dashscope:
    enabled: true
    api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
    chat:
      options:
        model: qwen-plus

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:qwen-chat-secret-key-for-jwt-token-generation-very-long-string}
  expiration: 86400000

logging:
  level:
    com.qwen.chat: debug
    org.springframework.ai: debug

# CORS 配置
spring.mvc.cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
