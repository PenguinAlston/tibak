# 基础设施 Docker Compose 配置
# 仅包含 PostgreSQL，用于本地开发环境
# 前后端手动运行

version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: docker.1ms.run/bitnami/postgresql:latest
    container_name: qwen-chat-postgres
    environment:
      POSTGRES_DB: qwen_chat
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - qwen-chat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  qwen-chat-network:
    driver: bridge

volumes:
  postgres_data:
